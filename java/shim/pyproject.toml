[project]
name = "@NAME@-shim"
version = "0.1.0"
description = "Python entrypoint that starts a Java agent"
requires-python = ">=3.11"
dependencies = [
    "agent-engine-runner-shared>=0.11.3,<1",
    "jdk4py>=21,<22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["java_shim"]
