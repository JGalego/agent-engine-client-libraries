name: publish-javascript-package
description: Build and publish one JavaScript SDK package to npm.

inputs:
  name:
    description: npm package name (e.g. @mongodb-js/agent-engine-sdk)
    required: true
  directory:
    description: Directory under javascript/packages/
    required: true
  build-first:
    description: Comma-separated workspace names to build before this package
    required: false
    default: ""
  dry-run:
    description: Pack and validate without uploading
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install and build
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.name }}
        BUILD_FIRST: ${{ inputs.build-first }}
      run: |
        set -euo pipefail
        cd javascript
        npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
        IFS=',' read -ra extras <<< "$BUILD_FIRST"
        for workspace in "${extras[@]}" "$PACKAGE_NAME"; do
          [ -n "$workspace" ] || continue
          npm run build --workspace="$workspace"
        done

    - name: Publish package
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.name }}
        PACKAGE_DIRECTORY: ${{ inputs.directory }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: ./scripts/publish-javascript-package.sh --name "$PACKAGE_NAME" --directory "$PACKAGE_DIRECTORY"
