#
# SDK package release. One publish job per package in dependency order. SDK
# tests run in the monorepo's CI, not here: they read fixtures that live
# outside the published snapshot. A failed job skips its dependents, and needs:
# serializes the chain to match the real-publish graph.
#
# Python jobs build the distributions and hand them to the official PyPI publish
# action, which authenticates with trusted publishing (short-lived OIDC, no
# stored token). JavaScript also uses trusted publishing through the npm CLI.
# Both publish only when resolve-mode says so; every other run builds or packs
# without uploading.
# Python and JavaScript chains run in parallel after resolve-mode.
#
# resolve-mode is the only place the publish decision is made. The dry run
# defaults on, so publishing for real takes one deliberate flip: turn the dry
# run off. Dry runs validate packaging without testing upload authorization.
#
name: SDK release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: sdk-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-mode:
    name: resolve-mode
    runs-on: ubuntu-latest
    outputs:
      dry-run: ${{ steps.mode.outputs.dry-run }}
    steps:
      - name: Resolve publish mode
        id: mode
        shell: bash
        env:
          SDK_PUBLISH_DRY_RUN: ${{ vars.SDK_PUBLISH_DRY_RUN || 'true' }}
        run: |
          set -euo pipefail
          case "$SDK_PUBLISH_DRY_RUN" in
            true) description="dry run (validates artifacts, uploads nothing)" ;;
            false) description="REAL PUBLISH to the public registries" ;;
            *)
              echo "::error::SDK_PUBLISH_DRY_RUN must be true or false"
              exit 1
              ;;
          esac
          echo "dry-run=$SDK_PUBLISH_DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Mode: $description"
          echo "### SDK release mode: $description" >> "$GITHUB_STEP_SUMMARY"

  publish-python-core:
    name: publish-python / agent-engine-sdk
    needs: [resolve-mode]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.2"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "python/**/pyproject.toml"
      - uses: ./.github/actions/build-python-package
        with:
          name: agent-engine-sdk
          directory: agent-engine-sdk
      - name: Publish distribution to PyPI
        if: ${{ needs.resolve-mode.outputs.dry-run != 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  publish-python-memory:
    name: publish-python / agent-engine-sdk-memory
    needs: [resolve-mode, publish-python-core]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.2"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "python/**/pyproject.toml"
      - uses: ./.github/actions/build-python-package
        with:
          name: agent-engine-sdk-memory
          directory: agent-engine-sdk-memory
      - name: Publish distribution to PyPI
        if: ${{ needs.resolve-mode.outputs.dry-run != 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  publish-python-runner-shared:
    name: publish-python / agent-engine-runner-shared
    needs: [resolve-mode, publish-python-memory]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.2"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "python/**/pyproject.toml"
      - uses: ./.github/actions/build-python-package
        with:
          name: agent-engine-runner-shared
          directory: agent-engine-runner-shared
      - name: Publish distribution to PyPI
        if: ${{ needs.resolve-mode.outputs.dry-run != 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  publish-python-langgraph:
    name: publish-python / agent-engine-sdk-langgraph
    needs: [resolve-mode, publish-python-runner-shared]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.2"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "python/**/pyproject.toml"
      - uses: ./.github/actions/build-python-package
        with:
          name: agent-engine-sdk-langgraph
          directory: agent-engine-sdk-langgraph
      - name: Publish distribution to PyPI
        if: ${{ needs.resolve-mode.outputs.dry-run != 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  publish-python-adk:
    name: publish-python / agent-engine-sdk-adk
    needs: [resolve-mode, publish-python-runner-shared]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.2"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "python/**/pyproject.toml"
      - uses: ./.github/actions/build-python-package
        with:
          name: agent-engine-sdk-adk
          directory: agent-engine-sdk-adk
      - name: Publish distribution to PyPI
        if: ${{ needs.resolve-mode.outputs.dry-run != 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  publish-python-openai-agents:
    name: publish-python / agent-engine-sdk-openai-agents
    needs: [resolve-mode, publish-python-runner-shared]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.2"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "python/**/pyproject.toml"
      - uses: ./.github/actions/build-python-package
        with:
          name: agent-engine-sdk-openai-agents
          directory: agent-engine-sdk-openai-agents
      - name: Publish distribution to PyPI
        if: ${{ needs.resolve-mode.outputs.dry-run != 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  publish-js-core:
    name: publish-javascript / agent-engine-sdk-ts
    needs: [resolve-mode]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/publish-javascript-package
        with:
          dry-run: ${{ needs.resolve-mode.outputs.dry-run }}
          name: "@mongodb-js/agent-engine-sdk"
          directory: agent-engine-sdk

  publish-js-memory:
    name: publish-javascript / agent-engine-sdk-memory-ts
    needs: [resolve-mode, publish-js-core]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/publish-javascript-package
        with:
          dry-run: ${{ needs.resolve-mode.outputs.dry-run }}
          name: "@mongodb-js/agent-engine-sdk-memory"
          directory: agent-engine-memory
          build-first: "@mongodb-js/agent-engine-sdk"

  publish-js-runner-shared:
    name: publish-javascript / agent-engine-runner-shared
    needs: [resolve-mode, publish-js-memory]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/publish-javascript-package
        with:
          dry-run: ${{ needs.resolve-mode.outputs.dry-run }}
          name: "@mongodb-js/agent-engine-runner-shared"
          directory: agent-engine-runner-shared
          build-first: "@mongodb-js/agent-engine-sdk,@mongodb-js/agent-engine-sdk-memory"

  publish-js-langgraph:
    name: publish-javascript / agent-engine-sdk-langgraph-ts
    needs: [resolve-mode, publish-js-runner-shared]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/publish-javascript-package
        with:
          dry-run: ${{ needs.resolve-mode.outputs.dry-run }}
          name: "@mongodb-js/agent-engine-sdk-langgraph"
          directory: agent-engine-sdk-langgraph
          build-first: "@mongodb-js/agent-engine-sdk,@mongodb-js/agent-engine-sdk-memory,@mongodb-js/agent-engine-runner-shared"
